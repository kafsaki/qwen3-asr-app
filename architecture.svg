<svg viewBox="0 0 720 560" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --surface: #F7F7F8;
      --surface-muted: #EFEFF2;
      --text: #171717;
      --text-muted: #52525B;
      --border: rgba(23, 23, 23, 0.12);
      --brand: #4B3FE3;
      --brand-soft: #F2F7FF;
      --brand-text: #1A1759;
      --accent: #27D2BF;
      --accent-soft: #EAFBF8;
      --accent-text: #0F766E;
      --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    .th { fill: var(--text); font: 500 14px/20px var(--font-sans); }
    .t { fill: var(--text); font: 400 14px/20px var(--font-sans); }
    .ts { fill: var(--text-muted); font: 400 12px/18px var(--font-sans); }
    .tc { fill: var(--text-muted); font: 500 13px/20px var(--font-mono); }
    .arr { stroke: var(--text-muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .arr-brand { stroke: var(--brand); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .leader { stroke: var(--text-muted); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4 4; fill: none; }
    g.c-neutral > rect, rect.c-neutral { fill: var(--surface); stroke: var(--border); }
    g.c-neutral > .th { fill: var(--text); }
    g.c-neutral > .ts { fill: var(--text-muted); }
    g.c-brand > rect, rect.c-brand { fill: var(--brand-soft); stroke: var(--brand); }
    g.c-brand > .th { fill: var(--brand-text); }
    g.c-brand > .ts { fill: var(--brand); }
    g.c-external > rect, rect.c-external { fill: var(--surface); stroke: var(--border); }
    g.c-external > .th { fill: var(--text); }
    g.c-boundary > rect, rect.c-boundary { fill: none; stroke: var(--text-muted); stroke-dasharray: 6 3; }
    g.c-accent > rect, rect.c-accent { fill: var(--accent-soft); stroke: var(--accent); }
    g.c-accent > .ts { fill: var(--accent-text); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
    </marker>
    <marker id="arrow-brand" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#4B3FE3"/>
    </marker>
  </defs>

  <!-- Browser -->
  <g class="c-external">
    <rect x="250" y="16" width="220" height="40" rx="20" />
    <text class="th" x="360" y="41" text-anchor="middle">Browser</text>
  </g>

  <path class="arr" d="M360 56 L360 80" marker-end="url(#arrow)"/>

  <!-- Server Boundary -->
  <g class="c-boundary">
    <rect x="30" y="90" width="660" height="220" rx="12" />
    <text class="ts" x="50" y="108">Qwen3-ASR Server :8000</text>
  </g>

  <!-- Uvicorn -->
  <g class="c-brand">
    <rect x="80" y="120" width="140" height="56" rx="8" />
    <text class="th" x="150" y="145" text-anchor="middle">Uvicorn</text>
    <text class="ts" x="150" y="164" text-anchor="middle">ASGI Server</text>
  </g>

  <path class="arr-brand" d="M220 148 L270 148" marker-end="url(#arrow-brand)"/>

  <!-- FastAPI -->
  <g class="c-brand">
    <rect x="280" y="120" width="140" height="56" rx="8" />
    <text class="th" x="350" y="145" text-anchor="middle">FastAPI</text>
    <text class="ts" x="350" y="164" text-anchor="middle">ASGI App</text>
  </g>

  <path class="arr" d="M350 176 L350 200" marker-end="url(#arrow)"/>

  <!-- API Routes -->
  <g class="c-neutral">
    <rect x="80" y="205" width="160" height="90" rx="8" />
    <text class="ts" x="160" y="222" text-anchor="middle">API Routes</text>
    <rect x="92" y="230" width="136" height="18" rx="4" fill="#EFEFF2"/>
    <text class="ts" x="160" y="243" text-anchor="middle">/api/transcribe</text>
    <rect x="92" y="252" width="136" height="18" rx="4" fill="#EFEFF2"/>
    <text class="ts" x="160" y="265" text-anchor="middle">/api/transcribe/batch</text>
    <rect x="92" y="274" width="64" height="14" rx="4" fill="#EFEFF2"/>
    <text class="ts" x="124" y="284" text-anchor="middle">/align</text>
  </g>

  <path class="arr" d="M350 160 L270 210 L260 210" />

  <!-- Static Files -->
  <g class="c-neutral">
    <rect x="280" y="205" width="140" height="56" rx="8" />
    <text class="th" x="350" y="230" text-anchor="middle">Static Files</text>
    <text class="ts" x="350" y="249" text-anchor="middle">HTML/CSS/JS</text>
  </g>

  <path class="arr" d="M160 295 L160 330 L260 330" marker-end="url(#arrow)"/>

  <!-- ThreadPoolExecutor -->
  <g class="c-brand">
    <rect x="270" y="215" width="140" height="56" rx="8" />
    <text class="th" x="340" y="238" text-anchor="middle">ThreadPool</text>
    <text class="ts" x="340" y="257" text-anchor="middle">run_in_executor()</text>
  </g>

  <path class="arr-brand" d="M340 271 L340 340" marker-end="url(#arrow-brand)"/>

  <!-- Model Pipeline Boundary -->
  <g class="c-boundary">
    <rect x="30" y="325" width="660" height="220" rx="12" />
    <text class="ts" x="50" y="343">Model Pipeline</text>
  </g>

  <!-- TranscribeEngine -->
  <g class="c-brand">
    <rect x="250" y="355" width="220" height="56" rx="8" />
    <text class="th" x="360" y="378" text-anchor="middle">TranscribeEngine</text>
    <text class="ts" x="360" y="397" text-anchor="middle">engine.run() — GPU 推理</text>
  </g>

  <!-- ModelHub -->
  <g class="c-neutral">
    <rect x="80" y="355" width="140" height="56" rx="8" />
    <text class="th" x="150" y="378" text-anchor="middle">ModelHub</text>
    <text class="ts" x="150" y="397" text-anchor="middle">Qwen3-ASR + Pyannote</text>
  </g>

  <path class="arr" d="M220 383 L250 383" marker-end="url(#arrow)"/>

  <path class="arr" d="M470 383 L500 383" marker-end="url(#arrow)"/>

  <!-- ExportUtils -->
  <g class="c-neutral">
    <rect x="510" y="355" width="140" height="56" rx="8" />
    <text class="th" x="580" y="378" text-anchor="middle">ExportUtils</text>
    <text class="ts" x="580" y="397" text-anchor="middle">SRT 字幕</text>
  </g>

  <!-- AudioUtils -->
  <g class="c-neutral">
    <rect x="80" y="435" width="140" height="56" rx="8" />
    <text class="th" x="150" y="458" text-anchor="middle">AudioUtils</text>
    <text class="ts" x="150" y="477" text-anchor="middle">ffmpeg 预处理</text>
  </g>

  <path class="arr" d="M250 440 L250 463 L220 463" marker-end="url(#arrow)"/>

  <!-- File Annotations -->
  <g class="c-accent">
    <rect x="460" y="105" width="70" height="20" rx="4" />
    <text class="ts" x="495" y="119" text-anchor="middle">main.py</text>
  </g>
  <path class="leader" d="M460 115 L425 115"/>

  <g class="c-accent">
    <rect x="460" y="145" width="70" height="20" rx="4" />
    <text class="ts" x="495" y="159" text-anchor="middle">main.py</text>
  </g>
  <path class="leader" d="M460 155 L425 155"/>

  <g class="c-accent">
    <rect x="460" y="235" width="70" height="20" rx="4" />
    <text class="ts" x="495" y="249" text-anchor="middle">main.py</text>
  </g>
  <path class="leader" d="M460 245 L425 245"/>

  <g class="c-accent">
    <rect x="460" y="380" width="70" height="20" rx="4" />
    <text class="ts" x="495" y="394" text-anchor="middle">engine.py</text>
  </g>
  <path class="leader" d="M460 390 L475 390"/>

  <g class="c-accent">
    <rect x="460" y="460" width="70" height="20" rx="4" />
    <text class="ts" x="495" y="474" text-anchor="middle">audio.py</text>
  </g>
  <path class="leader" d="M460 470 L225 470"/>

  <g class="c-accent">
    <rect x="460" y="462" width="70" height="20" rx="4" />
    <text class="ts" x="495" y="476" text-anchor="middle">hub.py</text>
  </g>
  <path class="leader" d="M460 472 L225 472"/>

  <g class="c-accent">
    <rect x="460" y="395" width="70" height="20" rx="4" />
    <text class="ts" x="495" y="409" text-anchor="middle">export.py</text>
  </g>
  <path class="leader" d="M460 405 L515 405"/>

  <g class="c-accent">
    <rect x="460" y="270" width="70" height="20" rx="4" />
    <text class="ts" x="495" y="284" text-anchor="middle">main.py</text>
  </g>
  <path class="leader" d="M460 280 L415 280"/>

  <g class="c-accent">
    <rect x="460" y="210" width="70" height="20" rx="4" />
    <text class="ts" x="495" y="224" text-anchor="middle">main.py</text>
  </g>
  <path class="leader" d="M460 220 L245 220"/>

  <!-- Legend -->
  <g transform="translate(560, 470)">
    <rect x="0" y="0" width="130" height="70" rx="8" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)"/>
    <text class="ts" x="12" y="18">图例</text>
    <rect x="12" y="26" width="14" height="10" rx="3" fill="#F2F7FF" stroke="#4B3FE3"/>
    <text class="ts" x="32" y="35">核心组件</text>
    <rect x="12" y="44" width="14" height="10" rx="3" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)"/>
    <text class="ts" x="32" y="53">辅助模块</text>
    <rect x="12" y="62" width="14" height="10" rx="3" fill="#EAFBF8" stroke="#27D2BF"/>
    <text class="ts" x="32" y="71">代码文件</text>
  </g>
</svg>